<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LexiSwipe — Master English vocabulary with swipeable flashcards, quizzes and pronunciation support.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LexiSwipe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LexiSwipe</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #lexi-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #ffffff;
      transition: opacity .4s ease;
    }
    #lexi-splash.hidden { opacity: 0; pointer-events: none; }
    #lexi-splash img {
      width: 92px;
      height: 92px;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(33, 100, 126, .28);
    }
    #lexi-splash .ring {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid rgba(33, 100, 126, .15);
      border-top-color: #21647e;
      animation: lexi-spin .9s linear infinite;
    }
    @keyframes lexi-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="lexi-splash">
    <img src="icons/Icon-192.png" alt="LexiSwipe">
    <div class="ring"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('lexi-splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(function () { splash.remove(); }, 450);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
